[project]
name = "earshot-server"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
dependencies = [
    "fastapi",
    "uvicorn",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "earshot"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx",
    "ruff==0.17.1",
    "black==26.10.1",
    "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "TID", "BLE", "C90"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
strict = true
packages = ["earshot"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
