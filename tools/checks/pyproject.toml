[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH"]
allowed-confusables = ["а", "в", "е", "к", "н", "о", "р", "с", "т", "у", "х"]

[tool.ruff.lint.isort]
known-first-party = ["no_media"]

[tool.black]
line-length = 100
target-version = ["py312"]
